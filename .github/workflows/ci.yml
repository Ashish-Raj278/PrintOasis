name: PrintOasis CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: printoasis-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: printoasis_ci
          POSTGRES_PASSWORD: ci-only-not-a-production-secret
          POSTGRES_DB: printoasis_ci_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U printoasis_ci -d printoasis_ci_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Verify clean PostgreSQL migrations
        env:
          PRINTOASIS_CI_MIGRATION_CHECK: "1"
          TEST_DATABASE_URL: postgresql://printoasis_ci:ci-only-not-a-production-secret@127.0.0.1:5433/printoasis_ci_test
        run: npm run ci:migrations

      - name: Syntax and repository checks
        run: npm run check

      - name: Check changed lines for whitespace errors
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" && "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            git diff --check "$PR_BASE_SHA...HEAD"
          elif [[ "$PUSH_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$PUSH_BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$PUSH_BASE_SHA" HEAD
          else
            git diff --check HEAD^ HEAD
          fi

      - name: Storage regression
        run: npm run storage:smoke

      - name: Upload security regression
        run: npm run upload:security:check

      - name: Operations and observability regression
        run: npm run ops:check

      - name: Isolated Redis regression
        env:
          REDIS_URL: redis://192.0.2.1:6379
          TEST_REDIS_URL: redis://127.0.0.1:6380
          TEST_REDIS_PREFIX: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run redis:smoke
