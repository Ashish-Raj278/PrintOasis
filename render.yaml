services:
  - type: web
    name: printoasis
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_NO_WARNINGS
        value: "1"
      - key: DATA_DIR
        value: /var/data
      - key: OBJECT_STORAGE_BACKEND
        value: s3
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_REGION
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: OBJECT_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_PUBLIC_BUCKET
        sync: false
      - key: OBJECT_STORAGE_PRIVATE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_FORCE_PATH_STYLE
        value: "false"
      - key: OBJECT_STORAGE_TIMEOUT_MS
        value: "30000"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: BASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: EMAIL_DELIVERY_ENABLED
        value: "true"
      - key: EMAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
    disk:
      name: printoasis-data
      mountPath: /var/data
      sizeGB: 5
