services:
  - type: web
    name: printoasis
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_NO_WARNINGS
        value: "1"
      - key: DATA_DIR
        value: /var/data
    disk:
      name: printoasis-data
      mountPath: /var/data
      sizeGB: 5
